[project]
name = "mrkt-scout-bot"
version = "0.1.0"
description = "Telegram bot for monitoring potentially undervalued MRKT gift listings"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
